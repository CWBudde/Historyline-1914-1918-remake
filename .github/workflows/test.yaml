name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main runs to its end, or the hour-long webapp job would never report between pushes
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-unit:
    uses: ./.github/workflows/test-unit.yaml

  test-lint:
    uses: ./.github/workflows/test-lint.yaml

  test-can-build:
    uses: ./.github/workflows/test-can-build.yaml

  test-wasm:
    uses: ./.github/workflows/test-wasm.yaml

  test-art:
    uses: ./.github/workflows/test-art.yaml

  test-webapp:
    uses: ./.github/workflows/test-webapp.yaml
