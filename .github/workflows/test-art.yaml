name: test-art

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-art:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check the art catalogue
        run: go run ./cmd/hl art check

      - name: Check the PULSE reference data
        run: go run ./cmd/hl review reference -check
