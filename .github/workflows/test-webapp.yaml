name: test-webapp

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Ebitengine dependencies for the Go golden exporter
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: webapp/package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Typecheck, lint, test and build the web edition
        run: just webapp-check

      - name: Report the site's size and enforce its limit
        run: just webapp-size

      - name: Install the browser engines
        run: pnpm --dir webapp exec playwright install --with-deps chromium firefox webkit

      - name: Play the production build in the browser engines
        run: pnpm --dir webapp run e2e
