name: test-webapp

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: webapp/package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Typecheck, lint, test and build the web edition
        run: just webapp-check
