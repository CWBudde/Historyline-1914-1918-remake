name: test-gfx

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-gfx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test inventory tooling
        run: python3 -m unittest discover -s tools/art-inventory -v

      - name: Check graphics inventory
        run: python3 tools/art-inventory/inventory.py --check
