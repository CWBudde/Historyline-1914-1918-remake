# run with treefmt --allow-missing-formatter (just fmt)

[global]
excludes = [
  # generated output and local originals
  "build/**",
  "original/**",
  # the graphics track and the user's manual reconstruction
  "art/**",
  "assets/**",
  "docs/manual/**",
  # data written by the Go tools (levels, fixtures, indexes)
  "*.json",
  "go.sum",
  "go.mod",
  # the web edition's dependencies and lockfile
  "**/node_modules/**",
  "webapp/pnpm-lock.yaml",
]

### Misc

[formatter.prettier]
command = "prettier"
options = ["-w"]
includes = ["*.html", "*.css", "*.js", "*.ts", "*.tsx", "*.yaml", "*.yml"]

### Go

[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]

[formatter.gci]
command = "gci"
options = ["write"]
includes = ["*.go"]
priority = 1        # run after gofumpt

### Shell

[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh"]

[formatter.shfmt]
command = "shfmt"
options = ["-s", "-w"]
includes = ["*.sh"]
priority = 1        # run after shellcheck

### Typst

[formatter.typstyle]
command = "typstyle"
options = ["-i"]
includes = ["*.typ"]
