  subtitle: Two Seater Low Level Fighter
  section: air
  faction: central
  photos:
  - file: img-092-149.jpg
    caption: ''
  text: >-
    The J 4-10 was the first all-metal plane of the War, employing the typical corrugated iron construction
    last used in the JU-52. Its all-metal construction and its 470 kg of 5 mm-thick armour plating for
    the crew, engine and tank meant that it could intervene in battles on the ground and withstand infantry
    attacks. From this point of view the J 4-10 was the precursor of modern-day low level fighters.
  spec:
