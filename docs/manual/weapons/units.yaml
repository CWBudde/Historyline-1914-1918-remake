- name: Zeppelin (Staaken) R VI
  subtitle: Heavy Bomber
  section: air
  faction: central
  photos:
  - file: img-094-157.jpg
    caption: ''
  text: >-
    The R-Series planes from the Zeppelin-Werke were the largest planes in the First World War. Although
    only capable of a maximum speed of 130 km/h, these giant planes were able to remain airborne for up
    to 10 hours. They carried a load of up to 2000 kg, which was enormous at the time - a contemporary
    fighter plane weighed between 600 and 1000 kg. With its range and bomb load the R VI put every other
    bomber in the shade. Only 18 R VIs were built, and they were used on the Eastern Front and to attack
    Great Britain.
  spec:
    items:
    - key: Powerplant
      value: four water-cooled 260 hp Mercedes D IVa six-cylinder in-line engines.
    - key: Dimensions
