  subtitle: Single Seater Fighting Scout
  section: air
  faction: central
  photos:
  - file: img-088-133.jpg
    caption: ''
  text: >-
    The E.I was constantly modified to maintain its superiority. The planes were equipped with two machine
    guns (for a time Immelmann flew a version with three) and a more powerful engine. The 300 E.IIIs which
    were built shot down approximately 1000 Allied planes, giving rise to the expression “Fokker plague”.
    After 1916, however, the monoplane was left behind by its Allied opponents, which were continually
    being improved.
