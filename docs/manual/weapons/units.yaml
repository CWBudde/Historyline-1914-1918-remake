    The Gotha G Vb - the G stood for “Grossflugzeug” - was the last version of a series of bombers bearing
    the name of the Gothaer Waggonfabrik. It had two 260 hp Mercedes engines and a top speed of 140 km/hour.
    It was used as a tactical bomber over the battle area and, among other missions, to bomb South-East
    England.
