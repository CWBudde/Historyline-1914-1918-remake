- name: Morane-Saulnier N
  subtitle: Single Seater Fighter
  section: air
  faction: allies
  photos:
  - file: img-096-165.jpg
    caption: ''
  text: >-
    This single-decker, with its considerable speed of 165 km/hour, was used by the French, British and
    Russians. In April 1915 the French flying ace Garros was shot down in one of these planes and the
    Germans saw the bullet deflectors on the propeller blades, which allowed the pilot to fire through
    the propeller. Fokker, who had encountered the same problem, solved it by developing the synchronised
    machine gun. Until the E.I came into service, the Germans had nothing to compare with this plane.
  spec:
    items:
    - key: Powerplant
      value: one 80 hp Gnome or 110 hp Le Rhone 9C or 9Ja nine-cylinder rotary engine.
