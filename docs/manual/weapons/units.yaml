- name: Sopwith Camel
  subtitle: Single Seater Fighter Scout
  section: air
  faction: allies
  photos:
  - file: img-101-185.jpg
    caption: ''
  text: >-
    This, the most famous fighter of the First World War, destroyed more enemy planes than any other model.
    It was while flying a Camel that the Canadian pilot Roy Brown shot down the “Red Baron” Manfred von
    Richthofen on 21 April 1918. As a result of the power which the rotary engine produced, the Camel
    could perform incredibly sharp turns and was generally extremely nimble. It did, however, need an
    experienced pilot, and a considerable number of inexperienced pilots crashed in Camels.
  spec:
