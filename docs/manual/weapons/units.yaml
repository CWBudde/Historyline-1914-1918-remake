- name: Static Balloon
  section: ground
  faction: both
  photos:
  - file: img-078-096.jpg
    caption: >-
      Balloon, held down by ground troops, before rising. The observer sat in a gondola under the balloon
      and had a parachute so that he could jump out in case enemy airplanes appeared.
  text: >-
    Balloons were used chiefly to observe the enemy and gave instructions to the artillery concerning
    range and direction of fire. They were usually defended by anti-aircraft guns and fighter planes.
    In HL 1914-1918 the balloons are used only as obstacles to force enemy pilots to fly over certain
    points. Balloons were both round and cigar-shaped.
