- name: Infantry
  section: ground
  faction: both
  photos:
  - file: img-062-030.jpg
    caption: German soldier
  - file: img-062-031.jpg
    caption: British soldier
  - file: img-062-032.jpg
    caption: French soldier
  text: >-
    At the outbreak of the First World War, the soldiers set off for the Front amid popular jubilation.
    Soon, however, the euphoria was to subside. In this war, the soldier was confronted by many new dangers;
    nowhere on the Front was safe, and it usually took two weeks for the soldiers to be relieved. Huge
    numbers of machine guns, attacks from the air, heavy-calibre artillery and poison gas were among the
    dangers with which the soldier was permanently threatened. A further element was the disastrous trench
    warfare at the Western Front, which had never been experienced before. For almost four years the Front
    moved backwards and forwards only marginally. In general, particularly towards the end of the War,
    the Allied troops had better provisions than their opponents.
  tactical:
    air: -/-
    water: 01/30
    ground: 01/30
    defence: '20'
    speed: '4'
    weight: '1'
    group: '6'
    cost: '35'
  impassable:
  - deep-water
  - shallow-water
  sprites:
  - img-062-033.png
  - img-062-034.png
  source-page: 5
- name: Elite Infantry
  section: ground
  faction: both
  photos:
  - file: img-063-036.jpg
    caption: Machine gun detachment with water-cooled MG.
  text: >-
    The elite infantry was composed of troops who were old enough to have “gained experience”. The recruits
    were cannon-fodder, and were given only meagre chances of survival. The elite infantry was always
    deployed when it was necessary to carry out tactically important actions. They were almost always
    better equipped and specially trained.
