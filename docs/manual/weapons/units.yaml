- name: Mobile Anti-aircraft Emplacement
  section: ground
  faction: both
  photos:
  - file: img-071-068.jpg
    caption: Anti-aircraft gun mounted on truck.
  text: >-
    The great disadvantage of the early anti-aircraft guns was that they were static and difficult to
    move. A great number of static guns were needed if a large area was to be defended satisfactorily.
    To make the guns mobile, they were placed on trucks. Since it is not easy to hit a moving airplane
    from the ground, shells loaded with explosive were used in place of ordinary ammunition; when they
    reached a certain height, these shells exploded into thousands of small fragments.
  tactical:
    air: 04/35
    water: '40'
    ground: '40'
    defence: '25'
    speed: '7'
    weight: '4'
