- name: Battle Tank Mark 1
  section: tanks
  faction: allies
  photos:
  - file: img-084-120.jpg
    caption: ''
  text: >-
    The British Mark 1 was the first battle tank in the world, and was deployed at the Battle of the Somme
    on 15 September 1916, where it struck terror into the German Infantry. For most models the British
    and French made a “male” version - equipped with guns and machine guns - and a “female” version, which
    was armed only with machine guns. The tactical value of these early models was, however, extremely
    small, as they often became stuck in the mud or broke down.
  spec:
    items:
    - key: Type
      value: 'Tank MK 1, “male” version: illustration shows “female” version.'
    - key: Manufacturer
      value: Foster & Metropolitan Carriage and Wagon Company.
    - key: Engine
