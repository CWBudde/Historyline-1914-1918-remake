    caption: ''
  text: >-
    The Spad XIII was a development of the Spad VII with a more powerful engine, and a second machine
    gun. No fewer than 18 French squadrons and many of the 16 squadrons in the American Expeditionary
    Corps were equipped with the “XIII”. It was very fast, reliable and so rugged that it could get pilots
    home safely even after being hit. About 8500 were built, many of which were exported after the War.
