- name: Patrol Boat
  section: navy
  faction: both
  photos:
  - file: img-105-201.jpg
    caption: ''
  text: >-
    The boat shown above is the type of patrol boat used in HL 1914-1918. These were small, partly armoured
    fast boats with light armament and machine guns. Patrol boats were used on rivers and on the coast
    for reconnaissance and guard duties. Their poor armament and armour plating were compensated for by
    their manoeuvrability.
