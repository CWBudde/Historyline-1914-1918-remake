    - key: Weight
      value: empty 6900–7350 kg, max. weight 11460 kg.
    - key: Performance
      value: >-
        maximum speed 130 km/h at sea level, rate of climb 100 m/min, service ceiling approx. 3800 m,
        range approx. 800 km, max. flying time, depending on bomb load, 7–10 hours.
    - key: Armaments
      value: >-
        two 7.92 mm manual machine guns in front cockpit, two manual guns in rear cockpit and one situated
        beneath the plane at the rear, fuselage bomb bay for up to 18 100 kg bombs, maximum load 2000
        kg.
    - key: History
      value: first flew June 1917.
