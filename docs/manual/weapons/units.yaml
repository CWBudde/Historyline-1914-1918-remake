- name: Bunker
  section: ground
  faction: both
  photos:
  - file: img-077-092.jpg
    caption: Armed bunker with raised observation sight, gun barrels retracted.
  text: >-
    Before the War, the Belgians and French built defensive emplacements like that illustrated along their
    eastern borders. It was impossible to gain superiority on a broad front, as Count Alfred von Schlieffen,
    who gave his name to the famous Schlieffen Plan, realised very early in the War. Instead, a number
    of strategically placed emplacements, for example at Namur and Antwerp, were selected and “opened
    up” by means of the largest-calibre guns available. The bunkers and forts were built of metre-thick
    reinforced concrete often reaching several metres underground. In addition to light or medium artillery,
    they also had machine guns for use in close combat and could be completely self-sufficient for short
    periods of time.
  tactical:
    air: -/-
    water: 03/60
    ground: 03/60
