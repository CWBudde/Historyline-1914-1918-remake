- name: Anti-Tank Weapons
  subtitle: PAK
  section: ground
  faction: both
  photos:
  - file: img-065-045.jpg
    caption: Anti-Tank Gun, probably 3.7 cm calibre, with periscopic sight.
  text: >-
    Until the last months of the War, tanks were used only by the Allies. To combat the tanks, the Central
    European Powers set up short-range batteries with low wheels. Special anti-tank shells were developed
    which were capable of penetrating the armour plating of most tanks. Among other means of combatting
    tanks was the 13 mm anti-tank gun.
