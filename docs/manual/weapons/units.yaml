- name: Voisin III (LA)
  subtitle: Two Seater Bomber
  section: air
  faction: allies
  photos:
  - file: img-102-189.jpg
    caption: ''
  text: >-
    This plane scored the first hit of the War on 5 October 1914. Despite its fragile appearance it was
    in fact sturdy. The armaments often included a machine gun on the fuselage, operated by a standing
    observer. Later models had 37 mm and 47 mm guns for ground attack. When the “single deckers” came
    on the scene, the Voisin Bombers’ chances of survival plummeted.
