- name: Fokker E.I
  subtitle: Single Seater Fighting Scout
  section: air
  faction: central
  photos:
  - file: img-087-129.jpg
    caption: ''
  text: >-
    The fact that it was the first plane to be able to fire through the propeller without damaging it
    made the E.I a feared opponent. Indeed, it was with the E.I that the era of aerial battles began;
    previously, the pilots had merely shot at each other with pistols or had simply waved to each other.
    With the E.I, Boelke and Immelmann developed the ground rules for modern aerial warfare and thus became
    heroes.
