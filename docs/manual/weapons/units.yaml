- name: Transport Ship
  section: navy
  faction: both
  photos:
  - file: img-109-217.jpg
    caption: ''
  text: >-
    The destiny of the British Empire had always been intimately bound up with seafaring. Many important
    raw materials came from overseas, without which the British would not have been able to conduct the
    War. Great Britain possessed a large number of transport and troop ships, which were augmented from
    1917 by American vessels. German cargo ships were confined during the War to the Baltic. The governments
    confiscated or chartered many ships for an indefinite period, in order to transport the enormous amounts
    of raw materials and supplies.
