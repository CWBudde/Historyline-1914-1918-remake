  subtitle: Single Seater Fighter Scout
  section: air
  faction: central
  photos:
  - file: img-091-145.jpg
    caption: ''
  text: >-
    The D.VII was a machine with extraordinary characteristics. It was fast, manoeuvrable and robust,
    and was regarded as the best plane of the First World War. It was introduced too late, however, to
    break the air superiority of the Allies. After the War the victorious Allies demanded that all remaining
    D.VIIs should be surrendered or destroyed - a telling testimony to the effectiveness of the plane.
  spec:
