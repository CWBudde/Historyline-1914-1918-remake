- name: Cavalry
  section: ground
  faction: both
  photos:
  - file: img-064-042.jpg
    caption: German Cavalry.
  text: >-
    Initially, mounted troops were successfully deployed in reconnaissance work; as the Western Front
    became rigidly fixed, however, the cavalry grew worthless. Despite this, almost all the armies continued
    to maintain cavalry troops up to the outbreak of the Second World War. Their chief advantages were
    speed, and the fact that horses do not require any spare parts, fuel or oil.
