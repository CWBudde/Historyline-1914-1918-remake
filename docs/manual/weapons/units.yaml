- name: Supply Depot
  subtitle: Construction Unit
  section: ground
  faction: both
  photos:
  - file: img-067-052.jpg
    caption: Depot under construction.
  text: >-
    In order to make supply routes shorter, large depots containing ammunition, food, fuel, heating material,
    building materials and other supplies were erected at a safe distance from the Front. Minor repairs
    to equipment were also carried out here. The depots were erected by motorised construction units,
    which in HL 1914-1918 are not armed.
