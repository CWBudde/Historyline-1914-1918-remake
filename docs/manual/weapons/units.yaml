- name: Light Field Artillery
  section: ground
  faction: both
  photos:
  - file: img-072-074.jpg
    caption: Russian 76.2 mm calibre Light Field Artillery with crew.
  text: >-
    Artillery was among the most important weaponry in the First World War. At first there were no planes
    to intervene in the war on the ground, and even later in the War their bomb load was extremely small.
    There was a huge variety of calibres and barrel length, not all of which can be described here. HL
    1914-1918 contains guns of three different calibres. The light field guns in HL 1914-1918 have barrels
    up to 75 mm calibre. This type of gun was comparatively easy to move and were deployed with some success
    against attacking troops. Their range and effectiveness however were small. The crew had to take the
    guns dangerously close to the front line to be sure they did not fire into their own ranks. Because
    of their weight and size, however, their firing position could be changed very rapidly.
  tactical:
    air: -/-
    water: 03/45
    ground: 03/45
    defence: '25'
    speed: '2'
    weight: '3'
    group: '6'
    cost: '55'
  impassable:
