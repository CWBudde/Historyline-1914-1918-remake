- name: Train-mounted artillery
  section: ground
  faction: both
  photos:
  - file: img-075-084.jpg
    caption: 38 cm long-barrelled gun being fired.
  text: >-
    Train-mounted artillery were huge cannons mounted on railway wagons, and had a range of 100 km or
    more. As well as the 38cm long-barrelled gun (illustrated), there were also 42 cm mortars, used primarily
    to attack fortified emplacements and obstacles. The shells used with “Big Bertha” weighed up to 1160
    kilograms and produced as much energy as a 200 ton goods train travelling at 90 km/hour. The great
    disadvantages of these guns were their slow rate of fire, the extremely high cost per shot fired,
    and the short life expectancy of the barrels. The train-mounted guns were, even more so than the heavy
    artillery, strategic weapons.
  tactical:
    air: -/-
    water: 07/90
    ground: 07/90
    defence: '40'
    speed: '5'
    weight: '35'
