  section: air
  faction: allies
  photos:
  - file: img-098-173.jpg
    caption: ''
  text: >-
    The Spad VII exceeded the expectations of the military leaders to such an extent that, after an initial
    order of 268, approximately 6000 planes were eventually built. Particularly noteworthy was the liquid-cooled
    Hispano-Suiza V-8 engine, which made the plane balanced in flight and gave it a remarkable top speed.
    The one serious defect was its outdated armament of only one machine gun.
