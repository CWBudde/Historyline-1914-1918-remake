  - img-072-073.png
  source-page: 15
- name: Medium Field Artillery
  section: ground
  faction: both
  photos:
  - file: img-073-076.jpg
    caption: Medium Gun in firing position.
  text: >-
    In HL 1914-1918, medium artillery includes guns from 75 mm to 150 mm calibre. Together with the light
    artillery, these guns were an important tactical element in battle; before an attack started, fire
    was directed at the enemy lines and then broken off to allow the infantry to advance. When defending,
    the guns set up a barrage of fire to stop the attacking troops and to deplete their numbers. By the
    end of the War, many of the German guns were worn out and had become inaccurate as a result of the
    terrible shortage of raw materials, and many shells landed among the German soldiers.
  tactical:
    air: -/-
    water: 05/55
    ground: 05/55
    defence: '27'
    speed: '1'
    weight: '4'
    group: '6'
    cost: '70'
