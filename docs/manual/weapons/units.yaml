    caption: ''
  text: >-
    The fully armoured Charron was developed in France in 1914. It was equipped with a machine gun, but
    despite the semi-circular steel supports which were attached to the sides and could be placed under
    the wheels if necessary, it was incapable of surmounting any significant obstacles. It was however
    faster than the later tracked vehicles. As a reconnaissance vehicle it performed well for the Allies.
