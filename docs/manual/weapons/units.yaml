- name: Torpedo Boat Destroyer
  section: navy
  faction: both
  photos:
  - file: img-107-209.jpg
    caption: ''
  text: >-
    The torpedo boat destroyers were larger, faster and more heavily armed than the torpedo boats. They
    were all-purpose fighting ships, well suited to defending big ships from torpedo attack, engaging
    enemy transport ships and submarines and carrying out reconnaissance work. The torpedo boat destroyer
    developed into the destroyer, which soon replaced its predecessor.
