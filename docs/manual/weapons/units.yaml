- name: Supply Train
  section: ground
  faction: both
  photos:
  - file: img-069-060.jpg
    caption: Freight Train with passenger and goods wagons.
  text: >-
    Supplies had to be transported over large distances, and motorised transport was not yet highly developed,
    so ordinary freight trains were employed for the purpose. The trains also took tanks and heavy artillery
    to their positions. These transport trains were usually not armed. In addition to the normal routes
    there was also a field route used to transport weaponry and munitions between the depots and the Front.
