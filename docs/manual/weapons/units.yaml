- name: Fokker Dr.I
  subtitle: Single Seater Fighter Scout
  section: air
  faction: central
  photos:
  - file: img-090-141.jpg
    caption: ''
  text: >-
    The red triplane of Manfred Freiherr von Richthofen is probably the most famous plane of the War.
    It was in this model that he achieved a record number of aerial victories. The plane’s performance
    was not exceptional, but it was extremely manoeuvrable and its light construction gave it a rapid
    rate of climb. The fame of the Dr.I is chiefly attributable to the excellent pilots who flew it. Its
    British counterpart, the Sopwith Triplane, was also very manoeuvrable.
  spec:
