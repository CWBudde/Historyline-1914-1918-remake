- name: Battleship
  subtitle: (Ship of the Line)
  section: navy
  faction: both
  photos:
  - file: img-108-213.jpg
    caption: ''
  text: >-
    Battleships or ‘Ships of the Line’ were the largest fighting ships and had very good armour plating
    and the heaviest artillery available. Their guns had a very long range and were extremely destructive.
    Because of their great weight, these ships were slower than destroyers or torpedo boats. On 31 May
    1916 large numbers of battle ships were involved in the biggest naval battle of the time; at the Skagerrak
    the Imperial Fleet was forced to defend itself against the numerically superior Grand Fleet.
