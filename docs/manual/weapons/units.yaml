- name: A7V Tank
  subtitle: (Sturmpanzerwagen)
  section: tanks
  faction: central
  photos:
  - file: img-080-104.jpg
    caption: ''
  text: >-
    The A7V was the first and only tank used by the German Army in the First World War. With armour plating
    up to 30 mm thick it was the best-protected armoured car of its time, and its six machine guns and
    its Belgian 5.7cm gun made it extremely powerful in battle. Despite several successful operations,
    only 20 had been built by the end of the War, as the powers that be underestimated for a long time
    the significance of tanks.
