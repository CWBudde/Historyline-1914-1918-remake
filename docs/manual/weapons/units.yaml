- name: Static Anti-aircraft Emplacement
  section: ground
  faction: both
  photos:
  - file: img-070-064.jpg
    caption: Standard machine gun on improvised tripod.
  text: >-
    The armies were comparatively slow to recognise the importance of airplanes; in the opinion of the
    Generals they should only be used for reconnaissance work. It is thus no wonder that, at the outbreak
    of war, there were practically no weapons for use against planes. As the danger from the air began
    to increase, standard machine guns were mounted on simple wooden supports. Later, special machine
    guns were used which fired small shells. Nevertheless, it was not easy to shoot down a moving plane,
    and large quantities of ammunition were required.
  tactical:
    air: 02/30
    water: '25'
    ground: '25'
    defence: '25'
    speed: '2'
    weight: '2'
