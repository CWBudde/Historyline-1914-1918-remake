  faction: both
  photos:
  - file: img-068-056.jpg
    caption: ''
  text: >-
    Trucks were increasingly used in addition to horse-drawn carts for transporting munitions, infantry
    troops and supplies. These trucks were not able to travel across rough terrain (the illustration shows
    their small rubber tyres), but could only travel over solid ground. These units were not armed.
