- name: Handley Page 0/400
  subtitle: Heavy Bomber
  section: air
  faction: allies
  photos:
  - file: img-103-193.jpg
    caption: ''
  text: >-
    Frederick Handley Page opened his first airplane factory in Barking in 1909. His prototype won the
    tender for the 0/100 and created one of the best bombers of the War. In 1916 the 0/100 was converted
    to become the 0/400. The plane’s defensive armaments were good - up to 5 machine guns - and could
    carry eight 113 kg bombs. To reduce losses by enemy fighters, bombing missions were later carried
    out at night.
  spec:
