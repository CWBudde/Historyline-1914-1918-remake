  subtitle: Single Seater Fighter Scout
  section: air
  faction: allies
  photos:
  - file: img-099-177.jpg
    caption: ''
  text: >-
    Initially fitted with unreliable engines, the S.E.5a became one of the most successful scouts of the
    War. The plane was easier to fly than the Camel, could climb faster and could withstand more direct
    hits. The armaments consisted of two machine guns, a Lewis on the upper wing and a synchronised Vickers
    on the engine, both aimed at a point 45 m in front of the plane. Among the air aces who flew this
    model were Ball, Bishop, Mannock and McCudden.
