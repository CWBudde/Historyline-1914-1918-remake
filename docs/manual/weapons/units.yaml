- name: Torpedo Boat
  section: navy
  faction: both
  photos:
  - file: img-106-205.jpg
    caption: ''
  text: >-
    Torpedo boats were fast fighting ships equipped with torpedoes and light guns. Because of the limited
    range of the torpedoes, the boats had to approach the enemy and withdraw extremely quickly. Torpedo
    boats were a dangerous weapon and the Navies possessed large numbers of them, since they were cheap
    to produce. As the armaments and armour plating improved, the torpedo boats developed into torpedo
    boat destroyers.
  spec:
