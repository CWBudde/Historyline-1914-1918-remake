- name: D.H.4
  subtitle: Two Seater Bomber
  section: air
  faction: allies
  photos:
  - file: img-104-197.jpg
    caption: ''
  text: >-
    The D.H.4 was the first British plane to be designed as a daylight bomber on the instructions of the
    Air Ministry. Pilot and observer were seated some distance apart so as to give the observer, who operated
    the twin machine gun in the tail, a better field of view. As a result, however, communication between
    them was impaired at the time they did not have radio communication. The plane was also built from
    late 1917 in the USA. Its most outstanding characteristic was its ability to out-manoeuvre enemy fighters.
  spec:
    items:
    - key: Powerplant
      value: one water-cooled 375 hp Rolls Royce Eagle VIII 12-cylinder V-engine.
    - key: Dimensions
