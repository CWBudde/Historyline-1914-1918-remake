  subtitle: Single Seater Fighter
  section: air
  faction: allies
  photos:
  - file: img-097-169.jpg
    caption: ''
  text: >-
    Air aces such as Nungesser, Guynemer, Ball and Bishop flew the Nieuport XVII for a long time. It was
    manoeuvrable, had a good climb rate and all in all was vastly superior to the E.I. The most serious
    drawback of the XI and XVI, the weak lower wing, had been rectified, creating an excellent plane.
    At first, an non-synchronised machine gun was mounted on the upper wing; later, as synchronised guns
    became available, this was replaced.
