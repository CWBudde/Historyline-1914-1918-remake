- name: Submarine
  section: navy
  faction: both
  photos:
  - file: img-110-221.jpg
    caption: ''
  text: >-
    As long as no immediate danger threatened, the U-boats travelled on the surface using their diesel
    engines and recharged their batteries in readiness for diving. Their chief weapons were torpedoes.
    For attacking unarmed targets, for example freighters, most types of U-boat had deck armaments. In
    the early years of the War, U-boats were a promising and dangerous weapon, which could only be attacked
    by ramming. As the War progressed, defences against the U-boats were improved and their task became
    more difficult.
  spec:
