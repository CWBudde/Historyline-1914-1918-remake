- name: Albatross D.III
  subtitle: Single Seater Fighter Scout
  section: air
  faction: central
  photos:
  - file: img-089-137.jpg
    caption: ''
  text: >-
    The D.III had a hand in “Bloody April” 1917, in which the Allied Air Forces suffered high losses.
    After the Allies had down-graded the “single-decker”, the D.III was introduced at the right moment
    to give the Germans air superiority again in the first half of 1917. Noteworthy features of the plane
    were the aerodynamic shape of the fuselage, and the fact that it was equipped with two machine guns
    at a time when its British and French counterparts had only one. Richthofen, Göring and Boelke flew
    the D.III and achieved many air victories with it.
  spec:
