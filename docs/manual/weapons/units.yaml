- name: Sappers
  section: ground
  faction: both
  photos:
  - file: img-066-048.jpg
    caption: Sappers laying track.
  text: >-
    Sappers dug trenches and battery emplacements, built bridges, and laid roads and rail lines. Sappers
    not only had to carry out heavy physical work, but were also often under enemy fire. In HL 1914-1918
    these units, which are lightly armed and can only defend themselves, are only used to dig and fill
    in trenches; they cannot build or destroy roads, bridges, track or buildings.
