    caption: ''
  text: >-
    The D.H.1 was built by Geoffrey de Havilland in 1915 for Airco (Aircraft Manufacturing Co.) The D.H.2
    first flew in Spring 1915. At first the pilot had to fire a hand gun while steering the plane with
    the other hand; later a fixed machine gun was mounted in the front cockpit. The D.H.2 was equal in
    performance to the Fokker E.III and helped to bring the “Fokker Plague” to an end. Approximately 450
    were built, 300 of which were deployed in France.
