  source-page: 16
- name: Heavy Field Artillery
  section: ground
  faction: both
  photos:
  - file: img-074-082.jpg
    caption: Heavy Field Gun (probably 150 mm).
  text: >-
    These guns could not be moved without a strong cart or truck. In addition, the ground on which the
    gun was positioned had to be sufficiently firm so that the gun did not sink into the earth. A 21 cm
    gun had a range of up to 100 km, so that they were able to fire behind the enemy, for example on supply
    routes and command posts. As the shells weighed several hundred kilograms, the guns’ rate of fire
    was not high. All these facts made the heavy artillery primarily a strategic weapon.
  tactical:
    air: -/-
    water: 06/70
    ground: 06/70
    defence: '25'
    speed: '1'
    weight: '5'
