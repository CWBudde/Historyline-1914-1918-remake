- name: Armoured Train
  section: ground
  faction: both
  photos:
  - file: img-076-088.jpg
    caption: Gun wagon of an armoured train, probably on the Eastern Front.
  text: >-
    The armoured trains were protected by extremely thick armour plating and carried a number of guns
    and machine guns. No expense was spared in the trains’ armaments or armour plating. They were unbreachable
    fortresses which could only be stopped by being derailed. Naturally, they were not designed to attack
    but to support other units, for reconnaissance, patrolling or taking part in battles near towns, all
    of which tasks they performed well. They were also sent out ahead of ordinary goods trains to clear
    the way for them. In the First World War, armoured trains were chiefly used on the Eastern Front.
  tactical:
    air: 02/20
    water: 02/60
    ground: 02/60
    defence: '60'
    speed: '6'
    weight: '40'
    group: '1'
